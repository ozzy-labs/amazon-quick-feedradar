id: amazon-quick-supports-multi-dataset-anal-db90c501
sourceId: amazon-quick
title: Amazon Quick supports multi-dataset analytical capabiity
url: https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick/
publishedAt: 2026-08-06T06:54:00.000Z
fetchedAt: 2026-08-06T21:07:25.408Z
summary: |-
  <p>Today, Amazon Quick announces supporting multi-dataset topics, enabling users to model relationships across multiple datasets in a single topic and use that model to build dashboards and answer questions in natural language. Previously, answering a question in a Quick Sight visual that spanned datasets required pre-joining the data into a single dataset—adding manual JOIN logic in the data preparation, consuming extra SPICE capacity, and users have to rebuild multiple datasets based on different use cases or when the model changed. With multi-dataset topics, a topic becomes a reusable relational data model: users add multiple datasets, define the relationships once, and Quick performs the joins at runtime.</p>
  <p>The new capability applies for both dashboard building and natural-language Q&amp;A. For dashboard building, the topic acts as the data model, so a single visual can draw fields from multiple datasets and Quick generates the underlying join automatically—users author the semantic model once and reuse it across every visual in the dashboard. For natural-language analytics, users can point a chat agent directly at a topic and ask questions; the agent reads the relationships defined in the topic and performs runtime joins across datasets to answer, with no need to pre-join tables or prepare data first. Because both experiences query toward the same topic, one governed semantic model serves as the single source of truth for people and agents alike. Multi-dataset topics reuse existing dataset permissions and support row-level and column-level security (RLS/CLS), so established governance carries through every cross-dataset visual and every answer.</p>
  <p>Multi-dataset topics are now generally available in all AWS Regions <a href="https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs">where Amazon Quick is available</a>. To get started, see this <a href="https://aws.amazon.com/blogs/machine-learning/build-a-unified-semantic-layer-across-datasets-with-multi-dataset-topics-in-amazon-quick/">blog post</a>.</p>
