id: amazon-quick-now-supports-live-data-from-35b3e169
sourceId: amazon-quick
title: Amazon Quick now supports live data from your datasets in apps
url: https://aws.amazon.com/about-aws/whats-new/2026/09/live-data-in-apps
publishedAt: 2026-09-30T15:00:00.000Z
fetchedAt: 2026-10-02T21:13:46.152Z
summary: |-
  <p>Today, Amazon Quick adds support for building applications that use live data directly from your Quick datasets, so the KPIs, charts, tables, and insights in your application always reflect the latest data. These applications go beyond viewing data. They facilitate intelligent, data-driven business operations workflows where each person can act on what they see, from handling requests and approvals to triggering the next step. Each application user sees data under their own Amazon Quick permissions, so the row-level and column-level security you already set up is applied.</p>
  <p>To build one, give the app builder chat agent the name of the dataset you want to use and describe in plain language what you want to build. This lets you enrich an application, such as a team portal that handles requests and approvals and now also shows current pipeline numbers, where each application user sees only the data their permissions allow.</p>
  <p>This feature is available in <a href="https://docs.aws.amazon.com/quick/latest/userguide/apps-limitations.html#apps-regional-availability">all supported regions of apps in Amazon Quick</a>. To see how it works, read the&nbsp;<a href="https://aws.amazon.com/blogs/machine-learning/serve-live-governed-data-in-ai-built-apps-with-amazon-quick/" target="_blank">blog post</a>. To learn more, see <a href="https://docs.aws.amazon.com/quick/latest/userguide/connecting-datasets-apps.html" target="_blank" rel="noopener noreferrer">Connecting to datasets</a>&nbsp;in the Amazon Quick User Guide.<i></i></p>
  <h2>&nbsp;</h2>
