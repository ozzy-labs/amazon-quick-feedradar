id: aws-partner-central-agents-mcp-server-no-0bf0d594
sourceId: amazon-quick
title: AWS Partner Central agents MCP Server now supports OAuth with AWS Sign-In
url: https://aws.amazon.com/about-aws/whats-new/2026/8/aws-partner-central-mcp/
publishedAt: 2026-08-20T18:02:00.000Z
fetchedAt: 2026-08-20T21:06:36.225Z
summary: |-
  <p>AWS partners can now access AWS Partner Central agents from tools they already use, such as Amazon Quick and Kiro, using OAuth through AWS Sign-In. Partners can authorize agent access with their existing AWS identities, sign-in methods, IAM permissions, and governance controls without installing or maintaining additional authentication software.</p>
  <p>Previously, AWS Partners needed to set up an MCP proxy with SigV4 credentials to access Partner Central agents from their existing tools, or sign in to AWS Partner Central through the AWS Management Console with IAM credentials. OAuth simplifies this by allowing partners to use AWS Sign-In to authorize tools such as Amazon Quick and Kiro to access Partner Central agents. Partners can use OAuth&nbsp;from their existing tools for co-sell engagements,&nbsp;AWS funding applications, and AWS Marketplace seller setup. Administrators can govern access with IAM policies, global condition keys, token introspection and revocation APIs, dynamic client registration, and CloudTrail audit events.</p>
  <p>OAuth support is available to AWS Partners through AWS Partner Central agents MCP Server, which is available in the US East (N. Virginia) Region. To learn more, visit &nbsp;<a href="https://docs.aws.amazon.com/partner-central/latest/developer-guide/mcp-getting-started.html">Getting started with the Partner Central agents MCP Server&nbsp;</a>, and &nbsp;<a href="https://docs.aws.amazon.com/signin/latest/userguide/oauth-sign-in-overview.html">Sign-In with OAuth 2.0&nbsp;</a>.</p>
