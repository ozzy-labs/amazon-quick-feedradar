id: amazon-quick-adds-deny-by-default-for-cu-01e87218
sourceId: amazon-quick
title: Amazon Quick adds deny by default for custom permissions
url: https://aws.amazon.com/whats-new/2026/08/amazon-quick-deny-by-default-permissions/
publishedAt: 2026-08-12T17:15:00.000Z
fetchedAt: 2026-08-13T21:13:43.429Z
summary: |-
  <p>Amazon Quick custom permissions now include deny by default, a governance setting that automatically restricts new AI capabilities before they reach users.<br>
  <br>
  Previously, new AI capabilities were available to all users on release, requiring administrators to react after the fact. With deny by default, administrators restrict the AI capability category in a custom permissions profile and assign it to users, roles, or the entire account. Quick then denies any new AI capability at launch for those users. Restricting a category also restricts existing capabilities in it. Administrators explicitly allow each capability when ready. The restriction applies only to the profile you configure.<br>
  <br>
  Configure deny by default in Manage account in Amazon Quick or through the AWS CLI. To learn more, see <a href="https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions-governance.html">Custom permissions deny by default</a>. Deny by default is available in all AWS Regions where <a href="https://docs.aws.amazon.com/quick/latest/userguide/regions.html">Amazon Quick is available</a>.</p>
