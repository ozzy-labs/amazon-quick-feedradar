id: amazon-quick-microsoft-365-extensions-ar-0b27375c
sourceId: amazon-quick
title: Amazon Quick Microsoft 365 extensions are now generally available
url: https://aws.amazon.com/amazon-quick-microsoft-365-extensions-generally-available
publishedAt: 2026-08-13T18:00:00.000Z
fetchedAt: 2026-08-13T21:13:43.429Z
summary: |-
  <p>Today, Amazon Quick announces the general availability of Microsoft 365 extensions for Excel, PowerPoint, Word, and Outlook. These extensions enable Quick to perform tasks directly within users' M365 environments, using AI to handle complex local tasks such as redlining documents, building financial models, creating presentation-ready decks, and managing Outlook inboxes.</p>
  <p>The Excel extension helps with complex spreadsheet analysis, creating pivot tables and charts, and importing and cleaning data. The PowerPoint extension helps you create and refine presentations from Quick data using organization-defined templates. The Word extension generates formatted documents with Word primitives, makes sweeping edits with track changes enabled, and participates as a reviewer in comments. The Outlook extension performs inbox and calendaring tasks such as prioritizing emails, organizing your inbox, scheduling meetings, and drafting replies using your Quick data and entire inbox context.</p>
  <p>These extensions transform daily work across teams. Finance teams can build complex models by describing what they need. Sales teams can draft proposals that automatically pull from CRM data. Marketing teams can create branded presentations without manual formatting. Legal teams can streamline contract reviews. Operations teams can manage email workflows and schedule meetings intelligently, and IT teams can automate routine data analysis that previously required manual effort.</p>
  <p>Amazon Quick Microsoft 365 extensions are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), Asia Pacific (Tokyo), and Europe (Frankfurt). To learn more, see <a href="https://aws.amazon.com/blogs/machine-learning/amazon-quick-for-microsoft-365-agentic-ai-where-you-work/">Amazon Quick for Microsoft 365: Agentic AI where you work</a>, and download extensions on the <a href="https://aws.amazon.com/quick/download/">Quick download page.</a></p>
