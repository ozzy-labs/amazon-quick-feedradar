id: amazon-quick-agentic-ai-capabilities-are-1da2323a
sourceId: amazon-quick
title: Amazon Quick agentic AI capabilities are now available in AWS GovCloud
  (US-West)
url: https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick-aws-govcloud-us-west/
publishedAt: 2026-08-11T23:00:00.000Z
fetchedAt: 2026-08-12T21:07:21.534Z
summary: >-
  <p>Today, AWS announces that Amazon Quick's agentic AI capabilities are now
  available in AWS GovCloud (US-West), bringing an agentic AI teammate to
  government and regulated-industry teams within an isolated, FedRAMP Class D
  (formerly High) authorized environment. Building on the analytics and business
  intelligence capabilities already available to customers in AWS GovCloud (US),
  Quick now turns questions into actions, helping teams drive mission-critical
  decisions faster without switching applications.</p>

  <p>With this launch, teams can build custom chat agents tailored to
  mission-specific workflows — including procurement, ATO compliance, and grants
  management — while keeping data hosted and processed entirely within the AWS
  GovCloud (US-West) Region. Spaces enforce least-privilege access by scoping
  information to the appropriate program office or mission area, ensuring
  analysts only access mission-relevant data. Quick also integrates with tools
  teams already rely on, including Microsoft 365, SharePoint, and OneDrive via
  GCC High connectors, as well as browser extensions.</p>

  <p>AWS GovCloud (US) Regions are isolated AWS Regions operated by U.S.
  citizens on U.S. soil, purpose-built to host sensitive data and regulated
  workloads. Customers can address the most stringent U.S. government security
  and compliance requirements, including the FedRAMP Class D (formerly High)
  baseline, Department of Defense Cloud Computing Security Requirements Guide
  (DoD SRG) Impact Levels 4 and 5, International Traffic in Arms Regulations
  (ITAR), Criminal Justice Information Services (CJIS), and Federal Information
  Processing Standard (FIPS) 140-3. Inference on authorized foundation models is
  processed within the AWS GovCloud (US-West) Region, and enterprise governance
  features are available at launch.</p>

  <p>With this launch, Amazon Quick's agentic AI capabilities are available in 8
  AWS Regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt,
  Ireland, London), Asia Pacific (Sydney, Tokyo), and AWS GovCloud
  (US-West).&nbsp;</p>

  <p>To learn more, visit the <a href="https://aws.amazon.com/quick/">Amazon
  Quick product page</a> and <a
  href="https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/">AWS GovCloud
  (US) documentation</a></p>
