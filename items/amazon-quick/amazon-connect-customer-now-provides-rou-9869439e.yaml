summary: |-
  <p>Amazon Connect Customer now provides routing step data in the analytics data lake, making it easier for customers to generate insights from routing decisions. Using the data lake, customers can leverage Amazon Athena and Amazon Quick to analyze trends, such as contacts queued and contacts joined at each routing step, without complex data pipelines. For example,&nbsp;an analyst can now report on how contacts progressed through each routing step, identify where agent matching criteria were relaxed, and measure the impact of routing step configurations on wait times and agent utilization.</p>
  <p>Routing step data is available in all AWS <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#analytics_datalake_region">regions</a> where Amazon Connect Customer data lake is offered. To learn more about Amazon Connect Customer data lake, see the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/data-lake-contact-data.html">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href="https://aws.amazon.com/connect/">Amazon Connect Customer website</a>.&nbsp;</p>
