id: amazon-quick-now-supports-per-user-resou-649f72b4
sourceId: amazon-quick
title: Amazon Quick now supports per-user resource limits
url: https://aws.amazon.com/whats-new/2026/08/amazon-quick-per-user-resource-limits/
publishedAt: 2026-08-12T22:17:00.000Z
fetchedAt: 2026-08-14T21:07:54.871Z
summary: |-
  <p>Amazon Quick now enables administrators to set per-user limits on index storage and agent hours, giving them direct control over subscription costs. With limits management, administrators can create limit profiles that cap per-user consumption, helping prevent unexpected overage charges and ensuring subscription entitlements are used efficiently across their organization.</p>
  <p>For example, an organization deploying Quick enterprise-wide to thousands of users can set account-level limit profiles to establish cost-predictable baselines, then assign higher limits to specific roles that require more agent hours. Administrators can create and assign limit profiles at the user, role, or account level, with a priority hierarchy that ensures the right users get the right capacity. When a user reaches their limit, new consumption is blocked while existing content is preserved.</p>
  <p>This feature is available for Professional and Enterprise plans, in all AWS Regions where Amazon Quick agentic capabilities are supported. For more information, see the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/" target="_blank" rel="noopener noreferrer">AWS Region table</a>.</p>
  <p>Learn more about Amazon Quick by visiting the <a href="https://aws.amazon.com/quick">Quick website</a>. To learn more about limit profiles, see Limits management in the <a href="https://docs.aws.amazon.com/quick/latest/userguide/limit-profiles.html" target="_blank">Amazon Quick User Guide</a>.&nbsp;</p>
